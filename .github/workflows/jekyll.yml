# Build and deploy Jekyll with custom plugins enabled.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Hourly: posts dated in the future (scheduled episodes) go live on the first
  # run after their release time. bin/release-due skips the build otherwise.
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  due:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: ruby bin/release-due
  build:
    needs: due
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.due.outputs.due == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ".ruby-version"
          bundler-cache: true
      - uses: actions/configure-pages@v5
      - run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    # Needed because "due" is skipped on pushes; without this, deploy is skipped too.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
