# Site settings
title: Pingback Podcast
description: >-
  Greg Molnar and Joel Gaff Jr. talk about Ruby on Rails, building indie products, and the people doing it.
url: "https://pingbackpodcast.com"
baseurl: ""
lang: en
hosts:
  - { name: "Greg Molnar", url: "https://greg.molnar.io" }
  - { name: "Joel Gaff Jr.", url: "https://joelgaff.com" }
timezone: America/Los_Angeles
# Social share card (1200px) is set per page via defaults below.
# Full 3000px podcast cover: assets/images/pingback-cover-3000.png
logo: /assets/images/cover.jpg
twitter:
  card: summary

theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

minima:
  skin: auto
  date_format: "%b %-d, %Y"
  nav_pages:
    - episodes.md
    - about.md
  # social_links:
  #   - { title: Pingback on GitHub, icon: github, url: "https://github.com/pingbackpodcast" }

# Buzzsprout show ID (the number in buzzsprout.com/<id>/...). Set it, then add
# buzzsprout_id to each episode to get the Buzzsprout player.
buzzsprout_podcast_id: ""

# Episodes are Jekyll posts in _posts/ and live at /episodes/<slug>/
permalink: /episodes/:title/

defaults:
  - scope: { path: "" }
    values:
      image: /assets/images/cover.jpg
  - scope: { path: "", type: posts }
    values:
      layout: episode

# Site-level update feed (feed.xml). The podcast RSS that Apple/Spotify read
# comes from the podcast host, not from here — see _data/platforms.yml.
feed:
  path: feed.xml

sass:
  quiet_deps: true
  silence_deprecations: [import]

exclude:
  - CLAUDE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .ruby-version
