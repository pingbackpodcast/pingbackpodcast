# Site settings
title: Pingback Podcast
tagline: Ruby, tech & more with Greg Molnar and Joel Gaff Jr.
description: >-
  Greg Molnar and Joel Gaff Jr. talk about Ruby on Rails, building indie products, and the people doing it.
url: "https://pingbackpodcast.com"
baseurl: ""
lang: en
hosts:
  - name: "Greg Molnar"
    url: "https://greg.molnar.io"
    photo: /assets/images/hosts/greg-molnar.jpg
    role: "Ruby developer and penetration tester"
  - name: "Joel Gaff Jr."
    url: "https://joelgaff.com"
    photo: /assets/images/hosts/joel-gaff.jpg
    role: "Rails developer in Portland, Oregon"
timezone: America/Los_Angeles
# Share cards (1200x630, made by bin/og-cards): og/default.png for pages via
# defaults below; each episode sets its own og/episode-N.png.
# Full 3000px podcast cover: assets/images/pingback-cover-3000.png
logo: /assets/images/cover.jpg
twitter:
  username: pingbackpodcast
  card: summary_large_image
social:
  name: Pingback Podcast
  links:
    - https://x.com/pingbackpodcast
    - https://www.youtube.com/@PingbackPodcast
    - https://podcasts.apple.com/us/podcast/the-pingback-podcast/id6818664245
    - https://open.spotify.com/show/0M7PYgsCtumUzsEKSgYfny
# Podcast RSS (Buzzsprout) — advertised in <head> so podcast apps can find it.
podcast_feed: https://rss.buzzsprout.com/2443886.rss

theme: minima
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

minima:
  skin: auto
  date_format: "%b %-d, %Y"
  nav_pages:
    - episodes.md
    - about.md
  # social_links:
  #   - { title: Pingback on GitHub, icon: github, url: "https://github.com/pingbackpodcast" }

# Buzzsprout show ID (the number in buzzsprout.com/<id>/...). Set it, then add
# buzzsprout_id to each episode to get the Buzzsprout player.
buzzsprout_podcast_id: "2443886"

# Episodes are Jekyll posts in _posts/ and live at /episodes/<slug>/
permalink: /episodes/:title/

defaults:
  - scope: { path: "" }
    values:
      image:
        path: /assets/images/og/default.png
        width: 1200
        height: 630
        alt: "Pingback Podcast: Ruby, tech & more with Greg Molnar and Joel Gaff Jr."
  - scope: { path: "", type: posts }
    values:
      layout: episode
      seo:
        type: PodcastEpisode


sass:
  quiet_deps: true
  silence_deprecations: [import]

exclude:
  - CLAUDE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .ruby-version
