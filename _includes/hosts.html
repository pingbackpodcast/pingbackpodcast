<div class="hosts">
  {%- for h in site.hosts %}
  <figure class="host card">
    <a href="{{ h.url }}" target="_blank" rel="noopener">
      <img src="{{ h.photo | relative_url }}" width="240" height="240" alt="{{ h.name }}" loading="lazy">
    </a>
    <figcaption>
      <a class="host__name" href="{{ h.url }}" target="_blank" rel="noopener">{{ h.name }}</a>
      <span class="host__role">{{ h.role }}</span>
    </figcaption>
  </figure>
  {%- endfor %}
</div>

<figure class="hosts-together">
  <img src="{{ '/assets/images/hosts/greg-and-joel.jpg' | relative_url }}" width="1085" height="1216"
    alt="Greg Molnar and Joel Gaff Jr. in cowboy hats in front of a brick wall, Joel holding a toy horse" loading="lazy">
  <figcaption>Greg and Joel, left to right.</figcaption>
</figure>
